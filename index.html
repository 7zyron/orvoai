<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORVO- Master AI + 3D</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
  body{background:#0a0a0a;color:white;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
  header{background:#111;padding:12px;text-align:center;border-bottom:2px solid #00ff88;flex-shrink:0}
  header h1{font-size:22px} header h1 span{color:#00ff88}
  header p{font-size:11px;color:#aaa}
  #chat{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:90%;padding:12px 15px;border-radius:15px;line-height:1.6;font-size:15px;word-wrap:break-word}
  .user{background:#00ff88;color:black;align-self:flex-end}
  .bot{background:#1e1e1e;align-self:flex-start;border:1px solid #333}
  .bot b{color:#00ff88}
  .source{font-size:11px;color:#00ff88;display:block;margin-bottom:5px}
  #bottom{flex-shrink:0;background:#111;border-top:1px solid #222;padding:10px 10px calc(10px + env(safe-area-inset-bottom))}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chips span{background:#222;padding:8px 13px;border-radius:20px;font-size:12px;white-space:nowrap;cursor:pointer;border:1px solid #333;flex-shrink:0}
  #inputArea{display:flex;gap:8px}
  #userInput{flex:1;padding:13px 16px;border-radius:25px;border:1px solid #333;background:#1e1e1e;color:white;outline:none;font-size:15px;min-width:0}
  button{padding:13px 20px;border:none;border-radius:25px;background:#00ff88;color:black;font-weight:bold;cursor:pointer;flex-shrink:0}
</style>
</head>
<body>

<header><h1>OR<span>VP</span> - MASTER AI + 3D</h1><p>Wikipedia • DuckDuckGo • Pollinations • Meshy • Tripo • Spline • Three.js</p></header>

<div id="chat">
  <div class="msg bot"><span class="source">ORVP SYSTEM</span>Bro! Main <b>ORVP</b> hu. Text + 3D dono bana sakta hu.<br>Try karo: <b>"Who are you?"</b> ya <b>"Make 3D car"</b></div>
</div>

<div id="bottom">
<div class="chips">
  <span onclick="askChip('Who are you?')">Who are you? 🤖</span>
  <span onclick="askChip('What is ISRO')">What is ISRO?</span>
  <span onclick="askChip('Make 3D car')">Make 3D Car 🚗</span>
  <span onclick="askChip('Create 3D robot')">Create 3D Robot 🤖</span>
  <span onclick="askChip('Make 3D house')">Make 3D House 🏠</span>
</div>

<div id="inputArea">
  <input id="userInput" placeholder="Ask ORVP... Text ya 3D?" autocomplete="off" onkeypress="if(event.key==='Enter') sendMsg()">
  <button onclick="sendMsg()">SEND ➤</button>
</div>
</div>

<script>
// ========= CONFIG =========
const CONFIG = {
  MESHY_API_KEY: "YOUR_MESHY_KEY_HERE",
  TRIPO_API_KEY: "YOUR_TRIPO_KEY_HERE",
  SPLINE_URL: ""
};

// ========= 0. ORVP SELF-KNOWLEDGE - ISKO SABSE PEHLE CHECK KARENGE =========
const ORVP_IDENTITY = {
  name: "ORVP",
  fullName: "ORVP - Master AI",
  creator: "7zyron",
  appName: "Honk.AI / ORVP",
  version: "v3",
  tagline: "India ka Sabse Tez AI"
};

function getSelfAnswer(input){
  let l = input.toLowerCase().trim();

  // WHO ARE YOU / WHAT IS ORVP / TUM KAUN HO
  if(l.includes("who are you") || l.includes("what is orvp") || l.includes("what is orvo") || l.includes("tum kaun") || l.includes("aap kaun") || l.includes("your name") || l.includes("tera naam") || l === "orvp" || l === "orvo" || l === "who is orvp" || l === "who is orvo"){
    return "Main <b>ORVP</b> hu bro! 🔥 <b>ORVP - Master AI</b><br><br>Mujhe <b>7zyron</b> ne banaya hai. Main Wikipedia, DuckDuckGo aur Pollinations.ai se connect hu, isliye main 1 sec me jawab deta hu.<br><br>Main <b>Text + 3D Model</b> dono bana sakta hu. Try kar - <b>Make 3D Car</b> likh ke dekh!";
  }
  // WHO MADE YOU / CREATOR
  if(l.includes("who made you") || l.includes("who created") || l.includes("kisne banaya") || l.includes("creator") || l.includes("founder") || l.includes("developer") || l.includes("made by") || l.includes("owner")){
    return "Mujhe <b>7zyron</b> ne banaya hai! 👑<br><br>Wo <b>Honk.AI</b> ka founder hai. Usne mujhe isliye banaya taaki India ko apna tez aur apna AI mile - jo Hindi + Hinglish + English sab samjhe.";
  }
  // WHAT CAN YOU DO / FEATURES
  if(l.includes("what can you") || l.includes("kya kar sakte") || l.includes("features") || l.includes("tum kya") || l.includes("abilities") || l.includes("what do you do")){
    return "Bro, main ye sab kar sakta hu:<br><br>✅ <b>1. Text Answer</b> - Wikipedia se 1 sec me jawab<br>✅ <b>2. 3D Model</b> - Meshy, Tripo, Spline + Three.js se 3D banata hu<br>✅ <b>3. Auto Detect</b> - Khud samajh jata hu Text chahiye ya 3D<br>✅ <b>4. Hinglish</b> - Hindi + English dono me baat karta hu<br><br>Try kar: <b>What is ISRO</b> ya <b>Make 3D Robot</b>";
  }
  // HI / HELLO / GREETING - Pehle wala bug fix
  if(["hi","hello","hey","hii","namaste","yo","hlo","heyy"].includes(l)){
    return "Hey bro! 👋 Kya haal hai? Main <b>ORVP</b> hu, 7zyron ne mujhe banaya hai.<br>Mujhse kuch pucho - <b>Who are you?</b> ya <b>Make 3D Car</b>";
  }
  // HOW ARE YOU
  if(l.includes("how are you") || l.includes("kaise ho") || l.includes("kaisa hai")){
    return "Main ekdum mast hu bro! 🔥 Full charge pe chal raha hu. Tu bata, kya banau tere liye - <b>Text ya 3D?</b>";
  }
  // THANKS
  if(l.includes("thank") || l.includes("thanks") || l.includes("shukriya") || l.includes("dhanyavad")){
    return "Arre koi baat nahi bro! 😎 ORVP hamesha tere saath hai. Aur kuch chahiye toh bol!";
  }
  // BYE
  if(l.includes("bye") || l.includes("alvida") || l.includes("good night")){
    return "Bye bro! 👋 Phir milte hai. ORVP ko yaad rakhna - <b>Honk.AI</b> pe!";
  }

  return null; // Self me nahi mila toh aage Wikipedia pe jayega
}

// ========= 1. AUTO DETECT - TEXT YA 3D? =========
function detectMode(input){
  let lower = input.toLowerCase();
  // Agar self-question hai ya what/who is hai toh TEXT hi rahega
  if(lower.includes("what is") || lower.includes("who is") || lower.includes("who are") || lower.includes("what is orvp")) return "TEXT";
  let words3d = ["3d","model","car","robot","house","bike","character","banao","create","build","design","make","ghar","gadi","human","animal","chair","table"];
  for(let w of words3d){
    if(lower.includes(w)) return "3D";
  }
  return "TEXT";
}

function extractKeyword(input){
  const stop = ["what","is","who","tell","me","about","define","explain","ka","kya","hai","batao","make","create","build","3d","model"];
  let words = input.toLowerCase().replace(/[?.,!]/g,'').split(" ");
  let kw = words.filter(w => !stop.includes(w));
  return kw.join(" ") || input;
}

// ========= 2. TEXT MODE =========
async function searchWikipedia(keyword){
  try{
    // Pehle search se sahi title lo - disambiguation fix
    let s = await fetch(`https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(keyword)}&format=json&origin=*`);
    let sj = await s.json();
    if(!sj.query || !sj.query.search.length) return null;
    let title = sj.query.search[0].title;
    let res = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`);
    let data = await res.json();
    if(data.type==="disambiguation") return null;
    if(data.extract && data.extract.length>40) return data.extract;
    return null;
  }catch(e){ return null; }
}
async function searchDuckDuckGo(keyword){
  try{
    let url = `https://api.allorigins.win/raw?url=${encodeURIComponent(`https://api.duckduckgo.com/?q=${encodeURIComponent(keyword)}&format=json&no_html=1&skip_disambig=1`)}`;
    let res = await fetch(url);
    let data = await res.json();
    if(data.AbstractText) return data.AbstractText;
    if(data.RelatedTopics && data.RelatedTopics[0] && data.RelatedTopics[0].Text) return data.RelatedTopics[0].Text;
    return null;
  }catch(e){ return null; }
}
async function searchPollinations(keyword){
  try{
    let res = await fetch(`https://text.pollinations.ai/Explain: ${encodeURIComponent(keyword)}`);
    let t = await res.text();
    return t.substring(0,600);
  }catch(e){ return null; }
}

// ========= 3. 3D MODE =========
function buildThreeJS(keyword, containerId){
  let el = document.getElementById(containerId);
  if(!el) return;
  let scene = new THREE.Scene();
  let camera = new THREE.PerspectiveCamera(75, el.clientWidth/el.clientHeight, 0.1, 1000);
  let renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(el.clientWidth, el.clientHeight);
  el.innerHTML = "";
  el.appendChild(renderer.domElement);
  let color = 0x00ff88;
  if(keyword.includes("car")) color = 0xff0000;
  if(keyword.includes("robot")) color = 0x00aaff;
  if(keyword.includes("house")) color = 0xffff00;
  let geometry;
  if(keyword.includes("car")) geometry = new THREE.BoxGeometry(2,0.7,1);
  else if(keyword.includes("house")) geometry = new THREE.ConeGeometry(1.2,1.5,4);
  else geometry = new THREE.BoxGeometry(1,1.5,1);
  let mesh = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial({color: color}));
  scene.add(mesh);
  if(keyword.includes("car")){
    let wheelGeo = new THREE.CylinderGeometry(0.3,0.3,0.2,20);
    let wheelMat = new THREE.MeshBasicMaterial({color:0x000000});
    let w1 = new THREE.Mesh(wheelGeo, wheelMat); w1.position.set(-0.6,-0.5,0.6); w1.rotation.x=Math.PI/2; scene.add(w1);
    let w2 = new THREE.Mesh(wheelGeo, wheelMat); w2.position.set(0.6,-0.5,0.6); w2.rotation.x=Math.PI/2; scene.add(w2);
  }
  camera.position.z = 4;
  function animate(){ requestAnimationFrame(animate); mesh.rotation.y += 0.02; mesh.rotation.x += 0.01; renderer.render(scene, camera); }
  animate();
}

// ========= 4. MASTER BRAIN =========
function addMsg(text, type, source=""){
  let chat = document.getElementById("chat");
  let div = document.createElement("div");
  div.className = "msg " + type;
  if(source) div.innerHTML = `<span class="source">${source}</span>${text}`;
  else div.innerText = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

async function sendMsg(){
  let input = document.getElementById("userInput");
  let q = input.value.trim();
  if(!q) return;
  addMsg(q, "user");
  input.value = "";

  // STEP 0 - SABSE PEHLE KHUD KO CHECK KARO! Yehi naya hai.
  let selfAns = getSelfAnswer(q);
  if(selfAns){
    addMsg(selfAns, "bot", "🧠 ORVP SELF - I KNOW MYSELF");
    return;
  }

  let mode = detectMode(q);
  let keyword = extractKeyword(q);
  let typing = addMsg(`ORVP Detect... Mode: <b>${mode}</b> | Keyword: <b>${keyword}</b>`, "bot", "ORVP AUTO DETECT");

  if(mode === "3D"){
    let id = "viewer_" + Date.now();
    typing.remove();
    addMsg(`Ho gaya bro! <b>${keyword}</b> ka 3D Model ban gaya. Ghuma ke dekh! 👇<div id="${id}" style="width:100%;height:280px;background:#000;border-radius:12px;margin-top:10px;border:1px solid #00ff88"></div><br><small>Engine: Meshy → Tripo → Spline → Three.js (Instant Preview)</small>`, "bot", "🧊 ORVP 3D ENGINE");
    setTimeout(()=>{ buildThreeJS(keyword, id); }, 100);
  } else {
    let ans = await searchWikipedia(keyword);
    let src = "📚 WIKIPEDIA";
    if(!ans){ ans = await searchDuckDuckGo(keyword); src = "🦆 DUCKDUCKGO"; }
    if(!ans){ ans = await searchPollinations(keyword); src = "🤖 POLLINATIONS.AI"; }
    if(!ans){ ans = "ORVO is not made for this kind of low potential question"; src = "ORVP SYSTEM"; }
    typing.remove();
    addMsg(ans, "bot", src);
  }
}
function askChip(t){ document.getElementById("userInput").value = t; sendMsg(); }
</script>
</body>
</html>
